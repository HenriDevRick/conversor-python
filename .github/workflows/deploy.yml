name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Obtém o conteúdo versionado do repositório.
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato estático
        run: |
          mkdir -p _site/css _site/js _site/assets
          cp index.html 404.html .nojekyll _site/
          cp css/* _site/css/
          cp js/* _site/js/
          cp assets/* _site/assets/ 2>/dev/null || true
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Publica o artefato no ambiente oficial do GitHub Pages.
      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4